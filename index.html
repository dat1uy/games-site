<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Website</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        display: grid;
        place-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: #1e293b;
        padding: 32px 48px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        text-align: center;
      }
      h1 {
        margin-top: 0;
        color: #60a5fa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Hello from Railway</h1>
      <p>Your website is working!</p>
    </div>
  </body>
</html>
