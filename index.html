<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Proxy</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 32px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
      }

      button {
        padding: 12px 32px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .result {
        margin-top: 30px;
        padding: 20px;
        background: #f5f5f5;
        border-radius: 8px;
        display: none;
      }

      .result.show {
        display: block;
      }

      .error {
        color: #e74c3c;
        padding: 15px;
        background: #ffe6e6;
        border-radius: 8px;
        margin-top: 20px;
        display: none;
      }

      .error.show {
        display: block;
      }

      .loading {
        text-align: center;
        color: #667eea;
        display: none;
      }

      .loading.show {
        display: block;
      }

      .loading::after {
        content: '...';
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes dots {
        0%, 20% {
          content: '.';
        }
        40% {
          content: '..';
        }
        60%, 100% {
          content: '...';
        }
      }

      iframe {
        width: 100%;
        height: 600px;
        border: none;
        border-radius: 8px;
        background: white;
      }

      .examples {
        margin-top: 30px;
        color: #666;
        font-size: 14px;
      }

      .examples p {
        margin-bottom: 8px;
      }

      .examples strong {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🌐 Web Proxy</h1>
      <p class="subtitle">Browse any website through this proxy</p>

      <div class="input-group">
        <input
          type="text"
          id="urlInput"
          placeholder="Enter a URL (e.g., example.com or https://google.com)"
        />
        <button onclick="fetchUrl()">Browse</button>
      </div>

      <div class="loading" id="loading">Loading</div>
      <div class="error" id="error"></div>
      <div class="result" id="result">
        <iframe id="proxyFrame" sandbox="allow-same-origin allow-forms allow-scripts allow-popups allow-top-navigation"></iframe>
      </div>

      <div class="examples">
        <p><strong>Try these:</strong></p>
        <p>• google.com</p>
        <p>• wikipedia.org</p>
        <p>• github.com</p>
      </div>
    </div>

    <script>
      const urlInput = document.getElementById('urlInput');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const result = document.getElementById('result');
      const proxyFrame = document.getElementById('proxyFrame');

      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          fetchUrl();
        }
      });

      async function fetchUrl() {
        const targetUrl = urlInput.value.trim();

        if (!targetUrl) {
          showError('Please enter a URL');
          return;
        }

        loading.classList.add('show');
        error.classList.remove('show');
        result.classList.remove('show');

        try {
          const response = await fetch('/proxy', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ url: targetUrl }),
          });

          if (!response.ok) {
            throw new Error('Failed to fetch URL');
          }

          const html = await response.text();
          proxyFrame.srcdoc = html;
          result.classList.add('show');
        } catch (err) {
          showError('Error: ' + err.message);
        } finally {
          loading.classList.remove('show');
        }
      }

      function showError(message) {
        error.textContent = message;
        error.classList.add('show');
      }
    </script>
  </body>
</html>
